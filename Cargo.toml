[package]
name = "display-types"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Shared display capability types for display connection negotiation."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/display-types"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "edid", "display"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]
include = ["src/**", "doc/**", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde", "bitflags/serde"]

[dependencies]
bitflags = "2.4"
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
